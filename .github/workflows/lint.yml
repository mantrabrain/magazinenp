name: Lint

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # style.css declares "Requires PHP: 5.6", so the theme still has to parse
        # there, as well as on a current release.
        php: ['5.6', '7.4', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  version-consistency:
    name: Version headers agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # WordPress.org reads the theme version from style.css. Version 1.2.11 was
      # published to the directory but never committed here, so master sat a
      # version behind; this catches the header half of that class of drift.
      - name: Compare style.css version with readme.txt
        run: |
          style=$(sed -n 's/^Version: *//p' style.css | head -1 | tr -d '\r')
          rver=$(sed -n 's/^Version: *//p' readme.txt | head -1 | tr -d '\r')
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | head -1 | tr -d '\r')
          echo "style.css Version   : $style"
          echo "readme.txt Version  : $rver"
          echo "readme.txt Stable   : $stable"
          if [ "$style" != "$rver" ] || [ "$style" != "$stable" ]; then
            echo "::error::Version mismatch - style.css Version, readme.txt Version and Stable tag must all match."
            exit 1
          fi
          echo "All three agree."

      - name: Changelog mentions this version
        run: |
          style=$(sed -n 's/^Version: *//p' style.css | head -1 | tr -d '\r')
          for f in readme.txt changelog.txt; do
            if ! grep -q "= *${style} " "$f"; then
              echo "::error::$f has no changelog entry for ${style}."
              exit 1
            fi
          done
          echo "Both changelogs mention ${style}."
